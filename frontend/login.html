<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shortico</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <script src="js/auth.js" defer></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">
            <img src="images/logo.svg" alt="Shortico Logo" class="logo-img">
            <h1 class="logo-text">Shortico</h1>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <img src="images/logo.svg" alt="Shortico Logo" class="auth-logo">
                <h2>Welcome Back</h2>
                <p>Login to your Shortico account</p>
            </div>
            <div class="auth-card">
                <h1>Welcome Back</h1>
                <p class="subtitle">Login to access your dashboard</p>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember"> Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary">Login</button>
                </form>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <div class="social-login">
                    <button class="btn-social google">
                        <img src="images/google-icon.svg" alt="Google">
                        Continue with Google
                    </button>
                    <button class="btn-social github">
                        <img src="images/github-icon.svg" alt="GitHub">
                        Continue with GitHub
                    </button>
                </div>

                <p class="auth-redirect">
                    Don't have an account? <a href="register.html">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 URL Shortener. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
