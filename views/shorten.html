<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorten URL - URL Shortener</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="images/logo.png" alt="URL Shortener Logo">
            <span>URL Shortener</span>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="features.html">Features</a>
            <a href="#" id="logout" class="btn-logout">Logout</a>
        </div>
    </nav>

    <main class="shorten-container">
        <h1>Shorten Your URL</h1>
        
        <div class="shorten-form-container">
            <form id="shortenForm" class="shorten-form">
                <div class="form-group">
                    <label for="originalUrl">Enter your long URL</label>
                    <input type="url" id="originalUrl" name="originalUrl" placeholder="https://example.com/very/long/url" required>
                </div>

                <div class="form-group">
                    <label for="customAlias">Custom Alias (optional)</label>
                    <div class="input-group">
                        <span class="input-group-text">https://short.url/</span>
                        <input type="text" id="customAlias" name="customAlias" placeholder="my-custom-alias">
                    </div>
                </div>

                <div class="form-group">
                    <label for="title">Title (optional)</label>
                    <input type="text" id="title" name="title" placeholder="My Shortened URL">
                </div>

                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <textarea id="description" name="description" placeholder="Description of the URL"></textarea>
                </div>

                <div class="form-group">
                    <label for="expiresAt">Expiration Date (optional)</label>
                    <input type="datetime-local" id="expiresAt" name="expiresAt">
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isActive" name="isActive" checked>
                        Make URL active immediately
                    </label>
                </div>

                <button type="submit" class="btn-primary">Shorten URL</button>
            </form>
        </div>

        <div class="result-container" id="resultContainer" style="display: none;">
            <h2>Your Shortened URL</h2>
            <div class="result-card">
                <div class="result-url">
                    <input type="text" id="shortenedUrl" readonly>
                    <button class="btn-copy" onclick="copyToClipboard()">Copy</button>
                </div>
                <div class="result-actions">
                    <a href="#" id="viewAnalytics" class="btn-secondary">View Analytics</a>
                    <a href="qr-code.html" id="generateQR" class="btn-secondary">Generate QR Code</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 URL Shortener. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/shorten.js"></script>
</body>
</html>
